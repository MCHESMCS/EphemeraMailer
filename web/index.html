<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ephemera · 邮件发送</title>
<style>
  :root {
    --bg:        #0a0f1c;
    --panel:     #111a2e;
    --panel-2:   #16213a;
    --line:      #1e2d4a;
    --line-2:    #2a3d5f;
    --txt:       #dbe4f0;
    --txt-dim:   #7b8aa3;
    --txt-mute:  #4a5a75;
    --accent:    #38bdf8;
    --accent-2:  #0ea5e9;
    --accent-txt:#06101f;
    --ok:        #34d399;
    --ok-bg:     rgba(52,211,153,.10);
    --danger:    #f87171;
    --danger-bg: rgba(248,113,113,.10);
    --warn:      #fbbf24;
    --warn-bg:   rgba(251,191,36,.10);
    --radius:    14px;
    --shadow:    0 8px 40px rgba(0,0,0,.6);

    --bg-mask-color: rgba(10,15,28,0.70);
    --card-alpha: 0.88;
    --card-bg-color: var(--panel);
    --page-mask: rgba(2,6,16,.45);
    --card-hover: rgba(255,255,255,.02);
    --row-hover: rgba(56,189,248,.03);
    --logo-bg: linear-gradient(135deg, var(--accent), #6366f1);
    --header-bg: rgba(10,15,28,0.6);
    --log-bg: #06090f;
    --log-txt: #7b8aa3;
    --overlay-bg: rgba(2,6,16,.72);
  }

  html[data-theme="light"] {
    --bg:        #f2efe9;
    --panel:     #faf9f6;
    --panel-2:   #f0ebe1;
    --line:      #e0dcd3;
    --line-2:    #d1ccbf;
    --txt:       #2d2a22;
    --txt-dim:   #5c5544;
    --txt-mute:  #948b78;
    --accent:    #0d7a5f;
    --accent-2:  #0a6350;
    --accent-txt:#ffffff;
    --ok:        #15803d;
    --ok-bg:     rgba(21,128,61,.10);
    --danger:    #b91c1c;
    --danger-bg: rgba(185,28,28,.10);
    --warn:      #b45309;
    --warn-bg:   rgba(180,83,9,.10);
    --shadow:    0 8px 40px rgba(80,70,50,.12);
    --card-hover: rgba(120,105,80,.05);
    --row-hover: rgba(13,122,95,.06);
    --logo-bg: linear-gradient(135deg, #0d7a5f, #1e3a8a);
    --header-bg: rgba(242,239,233,0.7);
    --overlay-bg: rgba(60,55,40,.40);
    --bg-mask-color: rgba(242,239,233,0.60);
    --card-alpha: 0.92;
    --card-bg-color: var(--panel);
    --page-mask: rgba(255,255,255,.12);
  }

  html[data-theme="light"][data-tone="green"] {
    --bg:        #ecf2e9;
    --panel:     #f6faf3;
    --panel-2:   #e2ebda;
    --line:      #d5e0cb;
    --line-2:    #c4d2b7;
    --txt:       #1f2a1c;
    --txt-dim:   #4b5a44;
    --txt-mute:  #7f8d78;
    --accent:    #1c7a4a;
    --accent-2:  #14643c;
    --accent-txt:#ffffff;
    --ok:        #15803d;
    --ok-bg:     rgba(21,128,61,.10);
    --danger:    #b91c1c;
    --danger-bg: rgba(185,28,28,.10);
    --warn:      #b45309;
    --warn-bg:   rgba(180,83,9,.10);
    --shadow:    0 8px 40px rgba(60,80,50,.10);
    --card-hover: rgba(70,100,60,.05);
    --row-hover: rgba(28,122,74,.06);
    --logo-bg: linear-gradient(135deg, #1c7a4a, #0f766e);
    --header-bg: rgba(236,242,233,0.7);
    --overlay-bg: rgba(50,70,40,.40);
    --bg-mask-color: rgba(236,242,233,0.60);
    --card-alpha: 0.92;
    --card-bg-color: var(--panel);
    --page-mask: rgba(255,255,255,.12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  html { background-color: var(--bg); transition: background-color .3s ease; }

  body::before {
    content: ''; position: fixed; inset: -3%; z-index: -2; pointer-events: none;
    opacity: 0; transition: opacity .5s ease, filter .5s ease;
    background: center / cover no-repeat;
    filter: blur(6px) saturate(.92) brightness(.92);
    transform: scale(1.04);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
    background: var(--page-mask);
  }
  html.has-bg body::before,
  html.has-bg body::after { opacity: 1; }

  body {
    background: transparent;
    color: var(--txt);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    position: relative;
    transition: color .3s ease;
  }

  .topbar {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    display: flex; align-items: center; gap: 8px;
  }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--txt-dim);
    cursor: pointer; transition: all .18s ease; flex-shrink: 0;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--panel-2); transform: translateY(-1px); }
  .theme-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  .theme-toggle .icon-sun  { display: none; }
  .theme-toggle .icon-moon { display: block; }
  html[data-theme="light"] .theme-toggle .icon-sun  { display: block; }
  html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

  .tone-switcher { display: none; align-items: center; gap: 4px; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line-2); flex-shrink: 0; }
  html[data-theme="light"] .tone-switcher { display: inline-flex; }
  .tone-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer; padding: 0; display: grid; place-items: center; transition: all .15s ease; }
  .tone-btn:hover { transform: translateY(-1px); }
  .tone-btn[data-tone-val="cream"] { background: #faf9f6; }
  .tone-btn[data-tone-val="green"] { background: #f6faf3; }
  .tone-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(13,122,95,.2); }

  .box {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both;
    position: relative;
    z-index: 1;
    transition: background-color .3s ease, border-color .3s ease;
  }
  html.has-bg .box {
    background: color-mix(in srgb, var(--card-bg-color) calc(var(--card-alpha) * 100%), transparent);
  }
  @supports not (background: color-mix(in srgb, red 50%, transparent)) {
    html.has-bg .box { background: var(--panel); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(14px) scale(.985); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  .box-head {
    padding: 28px 28px 20px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: var(--card-hover);
    position: relative;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .box-head::after {
    content:'';
    position:absolute; left:50%; bottom:-1px; transform:translateX(-50%);
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .brand-logo {
    width: 52px; height: 52px;
    margin: 0 auto 14px;
    display: grid; place-items: center;
    border-radius: 15px;
    background: var(--logo-bg);
    box-shadow: 0 6px 24px rgba(56,189,248,.28);
  }
  .brand-logo svg { width: 26px; height: 26px; stroke: var(--accent-txt); fill: none; stroke-width: 2.2; }

  .box-head h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; color: var(--txt); }
  .box-head p { font-size: 12.5px; color: var(--txt-dim); margin-top: 5px; }

  .box-body { padding: 26px 28px 28px; }

  .form-group { margin-bottom: 16px; }
  .form-group:last-of-type { margin-bottom: 22px; }

  .form-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 600; color: var(--txt-dim);
    letter-spacing: .5px; margin-bottom: 7px;
  }
  .form-label .hint { font-weight: 400; color: var(--txt-mute); font-size: 11px; }

  .input-wrap { position: relative; }
  .input-wrap .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px;
    stroke: var(--txt-mute); fill: none; stroke-width: 2;
    pointer-events: none; transition: stroke .2s; z-index: 1;
  }

  .input-wrap input:not([type=checkbox]) {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line-2);
    color: var(--txt);
    padding: 12px 14px 12px 40px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    transition: border-color .2s, box-shadow .2s, background .2s, color .3s;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .input-wrap input::placeholder { color: var(--txt-mute); }
  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,.14);
    background: var(--panel);
  }
  .input-wrap input:focus ~ .icon { stroke: var(--accent); }
  .input-wrap input:disabled { opacity: .55; cursor: not-allowed; }

  .custom-select-wrap { position: relative; user-select: none; }

  .custom-select-trigger {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line-2);
    color: var(--txt);
    padding: 12px 14px 12px 40px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    transition: border-color .2s, box-shadow .2s, background .2s, color .3s;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .custom-select-wrap.open .custom-select-trigger {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,.14);
    background: var(--panel);
  }
  .custom-select-wrap.open .input-wrap .icon { stroke: var(--accent); }
  .custom-select-wrap.open .chevron { transform: translateY(-50%) rotate(180deg); }

  .custom-select-trigger .chevron {
    position:absolute; right: 13px; top:50%; transform:translateY(-50%);
    width: 14px; height: 14px; stroke: var(--txt-mute);
    fill:none; stroke-width:2; pointer-events:none;
    transition: transform .2s ease, stroke .2s;
  }

  .custom-options {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    z-index: 999;
    max-height: 200px;
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all .2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .custom-select-wrap.open .custom-options {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .custom-option {
    padding: 11px 14px;
    font-size: 13.5px;
    color: var(--txt-dim);
    cursor: pointer;
    transition: all .15s;
    border-bottom: 1px solid var(--line);
  }
  .custom-option:last-child { border-bottom: none; }
  .custom-option:hover {
    background: var(--row-hover);
    color: var(--txt);
  }
  .custom-option.selected {
    color: var(--accent);
    background: var(--row-hover);
    font-weight: 600;
  }

  .params-panel {
    display: grid;
    grid-template-rows: auto 0fr;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(0,0,0,.15);
    overflow: hidden;
    transition: grid-template-rows .3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color .3s;
    margin-bottom: 22px;
  }
  html[data-theme="light"] .params-panel { background: var(--card-hover); }
  .params-panel.expanded {
    grid-template-rows: auto 1fr;
    border-color: var(--line-2);
  }
  .params-panel.hide { display: none; }

  .params-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .params-head:hover { background: var(--card-hover); }

  .params-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--txt-dim);
    letter-spacing: .3px;
  }
  .params-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }

  .params-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--txt-mute);
    background: var(--card-hover);
    padding: 1px 6px;
    border-radius: 6px;
    line-height: 1.4;
    margin-left: 2px;
  }

  .params-toggle {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    color: var(--txt-mute);
    transition: transform .3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .params-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

  .params-panel.expanded .params-toggle { transform: rotate(0deg); }
  .params-panel:not(.expanded) .params-toggle { transform: rotate(-90deg); }

  .params-body-wrapper { overflow: hidden; }
  .params-body {
    padding: 4px 16px 18px;
    border-top: 1px dashed var(--line);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .25s ease, transform .3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .params-panel.expanded .params-body { opacity: 1; transform: translateY(0); }
  .params-body .form-group:last-child { margin-bottom: 0; }

  .btn {
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 13px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .4px;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-txt);
    box-shadow: 0 6px 22px rgba(56,189,248,.28);
  }
  .btn:hover:not(:disabled) { transform: translateY(-1.5px); box-shadow: 0 10px 30px rgba(56,189,248,.42); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { cursor: not-allowed; opacity: .65; box-shadow: none; }
  .btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; }

  .btn.loading .btn-icon { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    display: none;
    margin-top: 16px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
    align-items: flex-start;
    gap: 9px;
    border: 1px solid transparent;
    word-break: break-word;
  }
  .msg.show { display: flex; animation: fadeUp .25s ease; }
  .msg svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 1px; }
  .msg.ok   { background: var(--ok-bg);     color: var(--ok);     border-color: rgba(52,211,153,.28); }
  .msg.err  { background: var(--danger-bg); color: var(--danger); border-color: rgba(248,113,113,.28); }
  .msg.warn { background: var(--warn-bg);   color: var(--warn);   border-color: rgba(251,191,36,.28); }

  .box-foot {
    padding: 14px 28px 18px;
    text-align: center;
    font-size: 11px;
    color: var(--txt-mute);
    letter-spacing: .3px;
    border-top: 1px solid var(--line);
    background: var(--card-hover);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .box-foot .dot {
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background: var(--ok); margin-right:6px;
    box-shadow: 0 0 8px var(--ok);
    vertical-align: middle;
  }

  @media (max-width: 480px) {
    body { padding: 16px; padding-top: 24px; }
    .box-head { padding: 24px 20px 18px; }
    .box-body { padding: 22px 20px 24px; }
    .box-foot { padding: 12px 20px 16px; }
    .topbar { top: 10px; right: 10px; }
  }
</style>

<script>
  (function(){
    try {
      var t = localStorage.getItem('bg_theme');
      if (t !== 'light' && t !== 'dark') {
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        t = prefersLight ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') {
        var tone = localStorage.getItem('bg_tone');
        if (tone !== 'cream' && tone !== 'green') tone = 'cream';
        document.documentElement.setAttribute('data-tone', tone);
      }
    } catch(e){
      document.documentElement.setAttribute('data-theme','dark');
    }
  })();
</script>
</head>
<body>

  <div class="topbar">
    <div class="tone-switcher" id="toneSwitcher" aria-label="亮色色调">
      <button class="tone-btn" data-tone-val="cream" title="浅米黄"></button>
      <button class="tone-btn" data-tone-val="green" title="浅绿"></button>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="切换日间/夜间模式" title="切换日间/夜间模式">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <div class="box" role="main">
    <header class="box-head">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M4 4h16v16H4z"/>
          <path d="M4 7l8 6 8-6"/>
        </svg>
      </div>
      <h1>Ephemera 邮件发送</h1>
      <p>蜉蝣网关 · 邮件发信服务</p>
    </header>

    <div class="box-body">
      <form id="sendForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="key">
            <span>API KEY</span>
            <span class="hint">发信凭证</span>
          </label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3M19 4l3 3"/></svg>
            <input type="password" id="key" placeholder="输入您的发信密钥" autocomplete="off" spellcheck="false" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="to">
            <span>收件人邮箱</span>
            <span class="hint">TO</span>
          </label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
            <input type="email" id="to" placeholder="someone@example.com" autocomplete="off" spellcheck="false" required>
          </div>
        </div>

        <div class="form-group" id="templateGroup">
          <label class="form-label" for="template">
            <span>邮件模板</span>
            <span class="hint">template</span>
          </label>
          <div class="input-wrap custom-select-wrap" id="customSelectWrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            <div class="custom-select-trigger" id="customSelectTrigger" tabindex="0" role="button" aria-haspopup="listbox">
              <span id="customSelectText">加载中...</span>
              <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="custom-options" id="customOptions" role="listbox"></div>
            <select id="template" style="display:none;"></select>
          </div>
        </div>

        <div class="params-panel hide" id="paramsPanel">
          <div class="params-head" id="paramsHead" role="button" tabindex="0" aria-expanded="true">
            <div class="params-title">
              <span class="dot"></span>
              模板参数
              <span class="params-count" id="paramsCount">0</span>
            </div>
            <div class="params-toggle">
              <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div class="params-body-wrapper">
            <div class="params-body" id="paramsBody"></div>
          </div>
        </div>

        <button type="submit" class="btn" id="sendBtn">
          <svg class="btn-icon" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          <span class="btn-text">发送邮件</span>
        </button>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>

    <footer class="box-foot">
      <span class="dot"></span>Secure Mail Gateway · Ephemera
    </footer>
  </div>

<script>
(function () {
  "use strict";

  /* ==================== 主题 & 色调（复用 admin 逻辑） ==================== */
  const THEME_KEY = 'bg_theme';
  const TONE_KEY  = 'bg_tone';

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  function currentTone() {
    const t = document.documentElement.getAttribute('data-tone');
    return (t === 'green' || t === 'cream') ? t : 'cream';
  }
  function applyTheme(theme, tone) {
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') {
      const t = (tone === 'green' || tone === 'cream') ? tone : currentTone();
      document.documentElement.setAttribute('data-tone', t);
      try { localStorage.setItem(TONE_KEY, t); } catch(e){}
    } else {
      document.documentElement.removeAttribute('data-tone');
    }
    try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
    syncToneButtons();
  }
  function syncToneButtons() {
    const active = currentTone();
    document.querySelectorAll('.tone-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.toneVal === active);
    });
  }
  function initThemeControls() {
    const themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
      });
    }
    const toneBox = document.getElementById('toneSwitcher');
    if (toneBox) {
      toneBox.addEventListener('click', (e) => {
        const btn = e.target.closest('.tone-btn');
        if (!btn) return;
        if (currentTheme() !== 'light') return;
        applyTheme('light', btn.dataset.toneVal);
      });
    }
    syncToneButtons();
  }
  (function() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (!saved && window.matchMedia) {
        const mq = window.matchMedia('(prefers-color-scheme: light)');
        const handler = e => {
          if (!localStorage.getItem(THEME_KEY)) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
            if (e.matches) {
              const t = localStorage.getItem(TONE_KEY) || 'cream';
              document.documentElement.setAttribute('data-tone', t);
            } else {
              document.documentElement.removeAttribute('data-tone');
            }
            syncToneButtons();
          }
        };
        if (mq.addEventListener) mq.addEventListener('change', handler);
        else if (mq.addListener) mq.addListener(handler);
      }
    } catch(e){}
  })();
  /* ================================================= */

  /* ==================== 壁纸层（复用 admin 机制） ==================== */
  if ("{{ENABLE_BG}}" === "true") {
    const BG_URL = "/assets/background.jpg";
    const probe = new Image();
    probe.onload = () => {
      const st = document.createElement('style');
      st.id = 'bgStyle';
      st.textContent = 'body::before{background-image:url("' + BG_URL.replace(/"/g, '\\"') + '");}';
      document.head.appendChild(st);
      document.documentElement.classList.add('has-bg');
    };
    probe.src = BG_URL;
  }
  /* ================================================= */

  const $ = id => document.getElementById(id);
  const form = $("sendForm");
  const msgEl = $("msg");
  const sendBtn = $("sendBtn");
  const templateSelect = $("template");

  const selectWrap = $("customSelectWrap");
  const selectTrigger = $("customSelectTrigger");
  const selectText = $("customSelectText");
  const optionsContainer = $("customOptions");

  const panel = $("paramsPanel");
  const panelBody = $("paramsBody");
  const panelCount = $("paramsCount");
  const panelHead = $("paramsHead");

  let templatesData = [];

  const ICONS = {
    ok:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>',
    err:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    warn: '<svg viewBox="0 0 24 24"><path d="M12 2L2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/></svg>'
  };

  function showMsg(type, text) {
    msgEl.className = "msg show " + type;
    msgEl.innerHTML = ICONS[type] + "<span></span>";
    msgEl.querySelector("span").textContent = text;
  }
  function hideMsg() {
    msgEl.className = "msg";
    msgEl.innerHTML = "";
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    sendBtn.classList.toggle("loading", on);
    sendBtn.querySelector(".btn-text").textContent = on ? "发送中…" : "发送邮件";
  }

  async function loadTemplates() {
    try {
      const res = await fetch('/api/templates', { cache: 'no-store' });
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.templates) && data.templates.length > 0) {
        templatesData = data.templates;

        templateSelect.innerHTML = '';
        optionsContainer.innerHTML = '';

        data.templates.forEach((t, index) => {
          const val = String(t.id);
          const label = String(t.name || t.id);

          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = label;
          templateSelect.appendChild(opt);

          const div = document.createElement('div');
          div.className = 'custom-option' + (index === 0 ? ' selected' : '');
          div.textContent = label;
          div.dataset.value = val;
          div.setAttribute('role', 'option');
          div.addEventListener('click', () => {
            templateSelect.value = val;
            updateCustomSelectUI();
            closeCustomSelect();
            handleTemplateChange(val);
          });
          optionsContainer.appendChild(div);
        });

        updateCustomSelectUI();
        handleTemplateChange(templatesData[0].id);

      } else {
        templateSelect.innerHTML = '<option value="">暂无可用模板</option>';
        selectText.textContent = '暂无可用模板';
        panel.classList.add('hide');
      }
    } catch (e) {
      templateSelect.innerHTML = '<option value="">加载模板失败</option>';
      selectText.textContent = '加载模板失败';
      panel.classList.add('hide');
    }
  }

  function updateCustomSelectUI() {
    const val = templateSelect.value;
    const selectedOpt = templateSelect.querySelector(`option[value="${val}"]`);
    if (selectedOpt) {
      selectText.textContent = selectedOpt.textContent;
    }
    document.querySelectorAll('.custom-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.value === val);
    });
  }

  function toggleCustomSelect() { selectWrap.classList.toggle('open'); }
  function closeCustomSelect() { selectWrap.classList.remove('open'); }

  selectTrigger.addEventListener('click', toggleCustomSelect);
  document.addEventListener('click', (e) => {
    if (!selectWrap.contains(e.target)) closeCustomSelect();
  });

  const PARAM_ICON = '<svg class="icon" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>';

  function renderFields(tmpl) {
    panelBody.innerHTML = '';
    if (!tmpl || !Array.isArray(tmpl.fields) || tmpl.fields.length === 0) {
      panel.classList.add('hide');
      return;
    }
    panel.classList.remove('hide');
    void panel.offsetWidth;
    panel.classList.add('expanded');
    panelCount.textContent = tmpl.fields.length;

    tmpl.fields.forEach(f => {
      const key = String(f.key || '');
      if (!/^[a-zA-Z0-9_-]+$/.test(key)) return;

      const group = document.createElement('div');
      group.className = 'form-group';

      const label = document.createElement('label');
      label.className = 'form-label';
      label.htmlFor = 'param_' + key;

      const nameSpan = document.createElement('span');
      nameSpan.textContent = '参数 · ' + key;

      const hintSpan = document.createElement('span');
      hintSpan.className = 'hint';
      hintSpan.textContent = f.label ? String(f.label) : '';

      label.appendChild(nameSpan);
      label.appendChild(hintSpan);

      const wrap = document.createElement('div');
      wrap.className = 'input-wrap';
      wrap.innerHTML = PARAM_ICON;

      const input = document.createElement('input');
      const safeType = ['text','email','number','tel','url'].includes(f.type) ? f.type : 'text';
      input.type = safeType;
      input.id = 'param_' + key;
      input.name = key;
      input.autocomplete = 'off';
      input.spellcheck = false;
      if (f.placeholder) input.placeholder = String(f.placeholder);

      wrap.appendChild(input);
      group.appendChild(label);
      group.appendChild(wrap);
      panelBody.appendChild(group);
    });
  }

  function togglePanel() {
    const isExpanded = panel.classList.toggle('expanded');
    panelHead.setAttribute('aria-expanded', String(isExpanded));
  }
  panelHead.addEventListener('click', togglePanel);
  panelHead.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePanel(); }
  });

  templateSelect.addEventListener('change', function () {
    handleTemplateChange(this.value);
  });

  function handleTemplateChange(val) {
    const tmpl = templatesData.find(t => String(t.id) === val);
    renderFields(tmpl);
    hideMsg();
  }

  function looksLikeEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  async function sendMail(e) {
    if (e) e.preventDefault();
    hideMsg();

    const key = $("key").value.trim();
    const to  = $("to").value.trim();
    const templateId = templateSelect.value;
    const tmpl = templatesData.find(t => String(t.id) === templateId);

    if (!key) { showMsg("warn", "请输入 API KEY"); $("key").focus(); return; }
    if (!to)  { showMsg("warn", "请输入收件人邮箱"); $("to").focus(); return; }
    if (!looksLikeEmail(to)) { showMsg("warn", "邮箱格式不正确"); $("to").focus(); return; }
    if (!templateId) { showMsg("warn", "请选择邮件模板"); return; }

    const params = new URLSearchParams();
    params.append("KEY", key);
    params.append("TO", to);
    params.append("template", templateId);

    if (tmpl && Array.isArray(tmpl.fields)) {
      for (const f of tmpl.fields) {
        const key2 = String(f.key || '');
        if (!/^[a-zA-Z0-9_-]+$/.test(key2)) continue;
        const input = document.getElementById('param_' + key2);
        if (input && input.value.trim()) params.append(key2, input.value.trim());
      }
    }

    setLoading(true);
    try {
      const res = await fetch("/api/web_send", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString(),
        credentials: "omit",
        cache: "no-store"
      });

      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch { throw new Error("服务器返回非 JSON（HTTP " + res.status + "）"); }

      if (data && data.ok) {
        showMsg("ok", "发送请求已受理，请稍候查收。");
        if (tmpl && Array.isArray(tmpl.fields)) {
          tmpl.fields.forEach(f => {
            const key2 = String(f.key || '');
            const input = document.getElementById('param_' + key2);
            if (input) input.value = "";
          });
        }
      } else {
        showMsg("err", "错误：" + ((data && data.error) || "unknown"));
      }
    } catch (err) {
      showMsg("err", "请求失败：" + (err && err.message ? err.message : err));
    } finally {
      setLoading(false);
    }
  }

  form.addEventListener("submit", sendMail);

  ["key", "to"].forEach(id => {
    $(id).addEventListener("input", hideMsg);
  });

  initThemeControls();
  loadTemplates();
  $("key").focus();
})();
</script>
</body>
</html>
